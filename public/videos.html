<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xfunds Videos</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--bg:#000000;--glass:rgba(255,255,255,.085);--glass2:rgba(255,255,255,.045);--line:rgba(255,255,255,.14);--text:#ffffff;--muted:#a8a8a8;--accent:#ffffff;--shadow:0 24px 90px rgba(0,0,0,.35)}
*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,system-ui,sans-serif;background:#000000;min-height:100vh}body:before{content:"";position:fixed;width:420px;height:420px;left:-150px;top:-100px;background:rgba(255,255,255,.10);border-radius:50%;filter:blur(70px);opacity:.6;z-index:-1}.app{width:min(1100px,100%);margin:auto;padding:20px 16px 80px}.glass{background:linear-gradient(145deg,var(--glass),var(--glass2));border:1px solid var(--line);backdrop-filter:blur(18px);box-shadow:var(--shadow)}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{font-size:25px;font-weight:950}.brand span{color:var(--accent)}.btn{border:1px solid var(--line);background:rgba(255,255,255,.075);color:var(--text);padding:12px 15px;border-radius:14px;font:inherit;font-weight:850;cursor:pointer;text-decoration:none;display:inline-block}.btn.primary{background:linear-gradient(135deg,#ffffff,#d6d6d6);color:#000000;border:0}.btn:disabled{opacity:.45}.title{border-radius:26px;padding:24px;margin-bottom:16px}.muted{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}.card{border-radius:24px;padding:18px}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:15px;background:#0a0a0a}.row{display:flex;gap:9px;align-items:center;justify-content:space-between;flex-wrap:wrap}.timer{color:var(--muted);font-size:13px;margin:10px 0}.ok{color:var(--accent)}.code{font-size:30px;letter-spacing:4px;font-weight:950;padding:18px;border-radius:18px;background:rgba(0,0,0,.22);text-align:center}.field{display:grid;gap:7px;margin:13px 0}.field label{font-size:12px;color:var(--muted);font-weight:800}.field input{width:100%;border:1px solid var(--line);background:rgba(10,10,10,.45);color:var(--text);padding:13px;border-radius:13px;outline:none}.connection{padding:14px;border:1px solid var(--line);border-radius:17px;margin-top:10px;background:rgba(0,0,0,.12)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);opacity:0;background:#0d0d0d;border:1px solid var(--line);padding:12px 16px;border-radius:14px;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:760px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="app">
