<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Xfunds Admin</title><button class="btn" onclick="show('whatsapp')">📱 WhatsApp Sessions</button><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
body{margin:0;background:#071018;color:#f8fbff;font-family:Inter,system-ui,sans-serif}.app{max-width:1200px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#101d27;border:1px solid #23333e;border-radius:20px;padding:18px}.muted{color:#9fb0c2}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.btn{padding:10px 13px;border-radius:12px;border:1px solid #334550;background:#13232e;color:#fff;cursor:pointer;font-weight:800}.danger{color:#ff9aa5}.ok{color:#76f2b4}.table{width:100%;border-collapse:collapse}.table td,.table th{padding:10px;border-bottom:1px solid #23333e;text-align:left;vertical-align:top}.search{padding:12px;width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #334550;background:#0c1820;color:#fff;margin-bottom:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}.table{font-size:12px;display:block;overflow:auto}}
</style></head><body><main class="app"><h1>🛡 Xfunds Admin</h1><p id="status" class="muted">Loading secure admin panel…</p><section id="stats" class="grid"></section><div class="tabs"><button class="btn" onclick="loadAll()">Refresh</button><button class="btn" onclick="show('withdrawals')">Withdrawals</button><button class="btn" onclick="show('cash-withdrawals')">💵 Cash withdrawals</button><button class="btn" onclick="show('proofs')">Proof reviews</button><button class="btn" onclick="show('users')">Users / risk</button><button class="btn" onclick="show('videos')">🎬 Manage videos</button><button class="btn" onclick="show('promos')">🎟️ Promo codes</button><button class="btn" onclick="show('analytics')">📊 Analytics</button><button class="btn" onclick="show('boosts')">🚀 Boost campaigns</button><button class="btn" onclick="show('system')">⚙️ System</button><button class="btn" onclick="show('audit')">Audit log</button></div><input id="q" class="search" placeholder="Search user by Telegram ID or username" oninput="searchUsers()"><section id="content"></section></main><script src="/admin.js"></script></body></html>
